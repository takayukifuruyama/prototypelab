    <meta charset="UTF-8">

    <title>お問い合わせ | PROTOTYPE LAB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <div class="container">
            <div class="header-inner">
                <div class="logo">
                    <a href="index.html">
                        <img src="img/logo.png" alt="PROTOTYPE LAB.">
                    </a>
                </div>
                <a href="index.html" class="header-cta">トップページに戻る</a>
            </div>
        </div>
    </header>

    <!-- お問い合わせフォーム -->
    <section class="contact-form-section">
        <div class="container">
            <h1>お問い合わせ</h1>
            <p class="intro">
                開発のプロフェッショナルが、あなたのアイデアを実現します。<br>
                まずは無料相談からお気軽にご連絡ください。
            </p>

            <div class="form-container">
                <form action="send_mail.php" method="POST">

                    <div class="form-group">
                        <label for="company">会社名 <span class="required">*</span></label>
                        <input type="text" id="company" name="company" required>
                    </div>

                    <div class="form-group">
                        <label for="name">お名前 <span class="required">*</span></label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">メールアドレス <span class="required">*</span></label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="tel">電話番号</label>
                        <input type="tel" id="tel" name="tel">
                    </div>

                    <div class="form-group">
                        <label for="plan">ご希望のプラン <span class="required">*</span></label>
                        <select id="plan" name="plan" required>
                            <option value="">選択してください</option>
                            <option value="light">ライト（¥100,000/月）</option>
                            <option value="standard">スタンダード（¥300,000/月）</option>
                            <option value="pro">プロ（¥500,000~/月）</option>
                            <option value="undecided">未定・相談したい</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="purpose">お問い合わせ内容 <span class="required">*</span></label>
                        <select id="purpose" name="purpose" required>
                            <option value="">選択してください</option>
                            <option value="sales">営業プレゼン支援</option>
                            <option value="newbusiness">新規事業検証</option>
                            <option value="lp">緊急LP・フォーム制作</option>
                            <option value="demo">開発営業の武器化</option>
                            <option value="other">その他</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">具体的なご相談内容 <span class="required">*</span></label>
                        <textarea id="message" name="message" required placeholder="プロジェクトの概要、納期のご希望、その他ご質問などをご記入ください"></textarea>
                    </div>

                    <button type="submit" class="submit-btn">送信する</button>
                </form>
            </div>
        </div>
    </section>

    <!-- フッター -->
    <footer class="contact-footer">
        <div class="container">
            <div class="contact-info">
                <div class="contact-item">
                    <strong>メールアドレス</strong>
                    <a href="mailto:contact@itnav.co.jp">contact@itnav.co.jp</a>
                </div>
                <div class="contact-item">
                    <strong>ウェブサイト</strong>
                    <a href="https://itnav.co.jp/" target="_blank" rel="noopener noreferrer">itnav.co.jp</a>
                </div>
            </div>

            <div class="company-info">
                <p>株式会社イトナブ | PROTOTYPE LAB.</p>
                <p style="margin-top: 10px;">© 2026 itnav Inc. All rights reserved.</p>
            </div>
        </div>
    </footer>

</body>
</html>
