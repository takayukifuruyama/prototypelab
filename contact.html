<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | PROTOTYPE LAB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Indie+Flower&display=swap" rel="stylesheet">
    <style>
        /* 基本設定 */
        :root {
            --primary-color: #FFFFFF; /* 白背景 */
            --accent-color: #FF6347; /* トマト色 */
            --accent-color-2: #FFD700; /* イエロー */
            --bg-light: #F9F9F9; /* 薄いグレー */
            --text-color: #333333; /* ダークグレー */
            --chalk-white: #333333; /* テキスト用ダークグレー */
        }
        body {
            font-family: "Indie Flower", "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, cursive, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-color);
            line-height: 1.6;
            background: var(--primary-color);
        }
        h1, h2, h3 {
            font-family: "Caveat", "Indie Flower", cursive;
        }
        a { text-decoration: none; }

        /* レイアウト */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ヘッダー */
        header {
            background: #FFFFFF;
            padding: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-bottom: 3px solid var(--accent-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            display: flex;
            align-items: center;
        }
        .logo img {
            height: 40px;
            width: auto;
        }
        .nav-btn {
            background: var(--accent-color);
            color: #fff;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }
        .nav-btn:hover {
            background: var(--accent-color-2);
            color: #333;
            transform: translateY(-2px);
        }

        /* お問い合わせフォーム */
        .contact-form-section {
            padding: 80px 0;
            background: var(--bg-light);
            min-height: calc(100vh - 80px);
        }
        .contact-form-section h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #333;
        }
        .contact-form-section .intro {
            text-align: center;
            margin-bottom: 50px;
            color: #333;
            font-size: 1.1em;
        }

        .form-container {
            max-width: 700px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 50px;
            border-radius: 8px;
            box-shadow: 4px 4px 8px rgba(0,0,0,0.1);
            border: 3px solid var(--accent-color-2);
        }

        .form-group {
            margin-bottom: 30px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--accent-color);
        }
        .form-group label .required {
            color: var(--accent-color);
            margin-left: 5px;
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
            font-family: inherit;
            box-sizing: border-box;
            background: #fff;
            color: #333;
        }
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .submit-btn {
            background: var(--accent-color);
            color: #fff;
            padding: 15px 50px;
            font-size: 1.2em;
            border: 2px solid var(--accent-color-2);
            border-radius: 5px;
            cursor: pointer;
            display: block;
            margin: 40px auto 0;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }
        .submit-btn:hover {
            background: var(--accent-color-2);
            color: #333;
            transform: translateY(-3px);
            box-shadow: 5px 5px 10px rgba(0,0,0,0.4);
        }

        /* フッター */
        footer {
            background: #333;
            color: #fff;
            padding: 40px 0;
            text-align: center;
            border-top: 4px solid var(--accent-color);
        }
        footer .contact-info {
            font-size: 1.1em;
            line-height: 2;
            margin-bottom: 20px;
            color: #fff;
        }
        footer a {
            color: var(--accent-color-2);
            text-decoration: underline;
        }
        .footer-note {
            font-size: 0.8em;
            color: #aaa;
            margin-top: 30px;
        }

        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            .form-container {
                padding: 30px 20px;
            }
            .contact-form-section h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <div class="container header-inner">
            <div class="logo">
                <a href="index.html">
                    <img src="img/logo.png" alt="PROTOTYPE LAB">
                </a>
            </div>
            <a href="index.html" class="nav-btn">トップページ</a>
        </div>
    </header>

    <!-- お問い合わせフォーム -->
    <section class="contact-form-section">
        <div class="container">
            <h1>お問い合わせ</h1>
            <p class="intro">
                開発のプロフェッショナルが、あなたのアイデアを実現します。<br>
                まずは無料相談からお気軽にご連絡ください。
            </p>

            <div class="form-container">
                <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

                    <div class="form-group">
                        <label for="company">会社名 <span class="required">*</span></label>
                        <input type="text" id="company" name="company" required>
                    </div>

                    <div class="form-group">
                        <label for="name">お名前 <span class="required">*</span></label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">メールアドレス <span class="required">*</span></label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="tel">電話番号</label>
                        <input type="tel" id="tel" name="tel">
                    </div>

                    <div class="form-group">
                        <label for="plan">ご希望のプラン <span class="required">*</span></label>
                        <select id="plan" name="plan" required>
                            <option value="">選択してください</option>
                            <option value="light">ライト（¥100,000/月）</option>
                            <option value="standard">スタンダード（¥300,000/月）</option>
                            <option value="pro">プロ（¥500,000~/月）</option>
                            <option value="undecided">未定・相談したい</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="purpose">お問い合わせ内容 <span class="required">*</span></label>
                        <select id="purpose" name="purpose" required>
                            <option value="">選択してください</option>
                            <option value="sales">営業プレゼン支援</option>
                            <option value="newbusiness">新規事業検証</option>
                            <option value="lp">緊急LP・フォーム制作</option>
                            <option value="demo">開発営業の武器化</option>
                            <option value="other">その他</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">具体的なご相談内容 <span class="required">*</span></label>
                        <textarea id="message" name="message" required placeholder="プロジェクトの概要、納期のご希望、その他ご質問などをご記入ください"></textarea>
                    </div>

                    <button type="submit" class="submit-btn">送信する</button>
                </form>
            </div>
        </div>
    </section>

    <!-- フッター -->
    <footer>
        <div class="container">
            <div class="contact-info">
                <p>Email: <a href="mailto:contact@itnav.co.jp">contact@itnav.co.jp</a></p>
                <p>Tel: 0225-90-4282</p>
            </div>
            <p class="footer-note">運営：<a href="https://itnav.co.jp/" target="_blank" rel="noopener noreferrer" style="color: #aaa; text-decoration: underline;">itnav.co.jp</a></p>
        </div>
    </footer>

</body>
</html>
